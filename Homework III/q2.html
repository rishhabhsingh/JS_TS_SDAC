<!DOCTYPE html>
<html>
<head>
    <title>Button Click Alert</title>
</head>
<body>
    <button id="myButton">Add To Cart</button>
    <script>
        let button = document.getElementById("myButton")
        button.addEventListener("click", function () {
            alert("Add To Cart is clicked!")
        })
    </script>


</body>
</html>

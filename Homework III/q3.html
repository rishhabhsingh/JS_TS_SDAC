<body>
    <p>Cart: <span id="countSpan">6</span></p>
    <button onclick="clearButton()">Reset Cart</button>

    <script>
        let count = 0

        function clearButton() {
            count = 0
            document.getElementById("countSpan").innerText = count
        }
    </script>
</body>
